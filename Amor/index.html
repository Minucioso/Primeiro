<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Para Meu Eterno Amor, MUMU>:3</title>

<style>
#pergunta{
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    background: transparent;

    padding: 0;
}

#pergunta h2{
    color: white;

    font-size: 35px;

    text-shadow:
        3px 3px 8px black,
        0 0 15px black;
}

#login{
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;
}

#login p{
    color: white;

    font-size: 22px;

    text-shadow:
        2px 2px 6px black,
        0 0 10px black;
}

#pergunta{
    display:none;
}

.escuro{
    background-image: none !important;
    background-color: black !important;
    transition: 2s;
}

.botaoAmor{

    font-size: 24px;

    padding: 10px 20px;

    margin: 10px;

    border-radius: 10px;

    background: white;

    border: 2px solid pink;

    cursor: pointer;

    animation: none !important;
}

.esquerda,
.direita{
    display: none;
}

h1{
    color:#ff4d88;

    text-shadow:
    0 0 10px pink,
    0 0 20px pink,
    0 0 30px pink;
}

body{
    background-image:
    url("imagens/fundo1.jpg");

    background-size: cover;
    background-position: center;

    margin:0;
    height:100vh;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-family:"Comic Sans MS", cursive;
}

#login button{

    animation: none !important;

    font-size: 20px;

    color: white;

    padding: 10px 20px;
}

.coracao{
    position: fixed;
    font-size: 30px;
    animation: subir 3s linear forwards;
    pointer-events: none;
}

@keyframes subir{
    from{
        transform: translateY(0);
        opacity: 1;
    }

    to{
        transform: translateY(-300px);
        opacity: 0;
    }
}

.esquerda{

    width: 50%;

    padding: 50px;
}

.direita{
    width: 40%;
    text-align: center;
}

h1{
    color: #ff8fc7;

    text-shadow:
        3px 3px 6px black,
        0 0 20px pink;
}

#contador{
    color: white;

    text-shadow:
        2px 2px 4px black;
}

#frase{
    font-size: 24px;
    margin-top: 20px;

    color: white;

    text-shadow:
        2px 2px 4px black;
}

#respostaAmor{
    color: white;

    text-shadow:
        2px 2px 5px black,
        0 0 10px black;
}

button{
    font-size: 40px;
    border: none;
    background: none;
    cursor: pointer;
    animation: pulsar 1s infinite;
}

@keyframes pulsar{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

img{
    max-width: 300px;
    border-radius: 5px;
    transition: opacity 0.5s;
}
</style>
</head>

<body>

<div id="login">

    <h1>Confirme sua Identidade >:3</h1>

    <p>Digite a senha:</p>

    <input id="senha">

    <button onclick="entrar()">
        Entrar
    </button>

</div>

<p id="amor"></p>

<audio id="musica" autoplay loop>
    <source src="musicas/LoveTheme.mp3" type="audio/mpeg">
</audio>

<div class="esquerda">
    <h1>Eu te amo porque...</h1>

    <p id="contador">0 / 25 ❤️</p>

    <button onclick="proximaFrase()">❤️</button>

    <p id="frase">Clique no coração ❤️</p>
</div>

<div class="direita">
    <img id="foto" src="imagens/foto1.jpg">
</div>

<div id="pergunta">

    <h2>Você me ama?</h2>

    <button class="botaoAmor" onclick="sim()">Sim ❤️</button>

    <button class="botaoAmor" onclick="nao()">Não 💔</button>

    <p id="respostaAmor"></p>

</div>

<script>


const frases = [
"Porque você me faz sorrir.",
"Porque você se preocupa comigo.",
"Porque eu amo conversar com você.",
"Porque você é incrível.",
"Porque você me entende.",
"Porque você é lindo.",
"Porque você me faz feliz.",
"Porque você é carinhoso.",
"Porque você é especial.",
"Porque eu amo passar tempo com você.",

"Porque você entrou na minha vida.",
"Porque você me escuta.",
"Porque você me faz rir.",
"Porque você é inteligente.",
"Porque você é gentil.",
"Porque você é divertido.",
"Porque você me alegra.",
"Porque você é único.",
"Porque eu amo estar contigo",
"Porque você me completa.",

"Porque você me faz sentir especial.",
"Porque você me faz sentir amado.",
"Porque você me faz sentir especial.",
"Porque você me ama",
"Porque eu te amo"

];

let indice = 0;
let musicaIniciada = false;

function criarCoracao(){

    const coracao = document.createElement("div");

    coracao.innerHTML = "❤️";
    coracao.classList.add("coracao");

    coracao.style.left =
    Math.random() * window.innerWidth + "px";

    coracao.style.bottom = "0px";

    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 3000);
}

function trocarFoto(novaFoto){

    let foto = document.getElementById("foto");

    foto.style.opacity = "0";

    setTimeout(() => {

        foto.src = novaFoto;

        foto.style.opacity = "1";

    }, 500);

}

function sim(){

    document.getElementById("respostaAmor").innerText =
    "❤️";

    for(let i = 0; i < 20; i++){
        criarCoracao();
    }

}

function entrar(){

    let senha =
    document.getElementById("senha").value;

    //tá fazendo o que aqui? :^
    const senhas = [
        "Hazy",
        "Murilo",
        "EuTeAmo",
        "GPO",
        "Eu te amo",
        "Ícaro",
        "Icaro",
        "Crucru",
        "ILOVEYOU",
        "Gago106quepapelao.231",
        "Hax",
        "Amor",
        "Meuamor",
        "MeuAmor",
        "Meu Amor",
        "Meu amor",
        "horana_2024"
    ];

    if(senhas.includes(senha)){

        document.getElementById("login")
        .style.display = "none";

        document.querySelector(".esquerda")
        .style.display = "block";

        document.querySelector(".direita")
        .style.display = "block";

        document.getElementById("musica")
        .play()
        .catch(() => {});

    }else{

        alert("Senha incorreta :3");

    }

}

function nao(){

    document.body.classList.add("escuro");

    document.getElementById("respostaAmor").innerText =
    "💔";

    document.getElementById("musica").pause();

}

function proximaFrase(){

    if(!musicaIniciada){

        document.getElementById("musica")
        .play()
        .catch(() => {});

        musicaIniciada = true;
    }

    for(let i = 0; i < 5; i++){
        criarCoracao();
    }

    if(indice < frases.length){

        document.getElementById("frase").innerText =
        frases[indice];

        indice++;

        document.getElementById("contador").innerText =
        indice + " / 25 ❤️";

        if(indice == 5){
            trocarFoto("imagens/foto2.jpg");
        }

        if(indice == 10){
            trocarFoto("imagens/foto6.jpg");
        }

        if(indice == 15){
            trocarFoto("imagens/foto4.jpg");
        }

        if(indice == 20){
            trocarFoto("imagens/foto5.jpg");
        }

        if(indice == 25){
            trocarFoto("imagens/foto3.jpg");
        }

    }else{

        document.getElementById("frase").innerText =
        "❤️ Esses foram apenas 25 motivos.\n\nPois existem infinitos motivos para eu te amar.\n\nEu te amo, Murilo ❤️";

        document.getElementById("pergunta")
        .style.display = "block";
    }

}
</script>

</body>
</html>
